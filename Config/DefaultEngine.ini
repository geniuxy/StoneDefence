[CoreRedirects]
; ---------------------------------------------------------------------------
; GeniuxyCommon 插件的这些类最早属于 StoneDefence 模块且以 Sd 命名，
; 之后先改名为 Ge*，再整体搬进了 GeniuxyCommon 插件。
; 旧蓝图（BP_Button_Lobby_*、BP_Button_Login、BP_Widget_Linking 等）内部
; 仍然保存着 /Script/StoneDefence.Ge* 这个父类路径，找不到就会连带
; WidgetBlueprintGeneratedClass 一起加载失败，表现为：
;   CreateExport: Failed to load Outer for resource 'WidgetTree' ...
;   以及类选择器里提示基类无效。
; 下面两组重定向把旧路径映射到插件里的真实路径。
; ---------------------------------------------------------------------------

; 1) 最早的名字（Sd*，位于 StoneDefence 模块）-> 插件中的最终名字
+ClassRedirects=(OldName="/Script/StoneDefence.SdCommonButtonBase",NewName="/Script/GeniuxyCommon.GeCommonButtonBase")
+ClassRedirects=(OldName="/Script/StoneDefence.SdCommonButtonImage",NewName="/Script/GeniuxyCommon.GeCommonButtonImage")
+ClassRedirects=(OldName="/Script/StoneDefence.SdCommonButtonSelection",NewName="/Script/GeniuxyCommon.GeCommonButtonSelection")
+ClassRedirects=(OldName="/Script/StoneDefence.SdListEntryDataObjectBase",NewName="/Script/GeniuxyCommon.GeListEntryDataObjectBase")
+ClassRedirects=(OldName="/Script/StoneDefence.SdWidgetListEntryBase",NewName="/Script/GeniuxyCommon.GeWidgetListEntryBase")
+ClassRedirects=(OldName="/Script/StoneDefence.SdCommonActivatableWidgetBase",NewName="/Script/GeniuxyCommon.GeCommonActivatableWidgetBase")
+ClassRedirects=(OldName="/Script/StoneDefence.SdCommonUserWidgetBase",NewName="/Script/GeniuxyCommon.GeCommonUserWidgetBase")

; 2) 已用改名后的 Ge* 路径存过盘的资源（当前报错的就是这一批）-> 插件
+ClassRedirects=(OldName="/Script/StoneDefence.GeCommonButtonBase",NewName="/Script/GeniuxyCommon.GeCommonButtonBase")
+ClassRedirects=(OldName="/Script/StoneDefence.GeCommonButtonImage",NewName="/Script/GeniuxyCommon.GeCommonButtonImage")
+ClassRedirects=(OldName="/Script/StoneDefence.GeCommonButtonSelection",NewName="/Script/GeniuxyCommon.GeCommonButtonSelection")
+ClassRedirects=(OldName="/Script/StoneDefence.GeListEntryDataObjectBase",NewName="/Script/GeniuxyCommon.GeListEntryDataObjectBase")
+ClassRedirects=(OldName="/Script/StoneDefence.GeWidgetListEntryBase",NewName="/Script/GeniuxyCommon.GeWidgetListEntryBase")
+ClassRedirects=(OldName="/Script/StoneDefence.GeCommonActivatableWidgetBase",NewName="/Script/GeniuxyCommon.GeCommonActivatableWidgetBase")
+ClassRedirects=(OldName="/Script/StoneDefence.GeCommonUserWidgetBase",NewName="/Script/GeniuxyCommon.GeCommonUserWidgetBase")